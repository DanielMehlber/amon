# AMON test configuration — synthetic / file-based demo.
#
# Generate the clip first, then monitor it:
#   python -m amon synth test-video.avi
#   python -m amon monitor test.yaml
#   python -m amon report test.yaml

session_name: test
data_dir: data

video_source:
  class: amon.sources.file.VideoFileSource
  config:
    path: test-video.avi
    realtime: false        # true paces playback like a live stream
    # processing_fps: 21   # optional cap; skip frames above this rate

# Optional image transforms (also used by stream.yaml):
# preprocessing:
#   scale: 100
#   rotate: 0
#   brightness: 0
#   contrast: 1.0

calibration:
  duration_seconds: 10.0

detectors:
  - class: amon.detectors.temporal.TemporalDetector
    config:
      # Per-anomaly threshold multipliers (1.2 = must exceed calibrated by 20%).
      tolerance:
        noise: 1.2
        flicker: 1.0
        contrast: 1.0
  - class: amon.detectors.hud.HudDetector
    config:
      tolerance:
        text: 1.0
        position: 1.2
        size: 1.2
        blink: 1.0
        new: 1.0
  - class: amon.detectors.spatial.SpatialDetector
    config:
      tolerance:
        distortion: 1.2

aggregation:
  cooldown_seconds: 1.0
  min_duration_seconds: 0.5
  # Exclusion hierarchy: primary anomalies suppress their side-effects.
  # '*' = any matching path (no element binding); '#' = same HUD element.
  suppresses:
    temporal/flicker: ["*"]
    temporal/noise: ["temporal/contrast"]
    hud/#/size: ["hud/#/text", "hud/#/position"]
    hud/#/position: ["hud/#/text"]

media:
  max_clip_seconds: 6.0
  lead_seconds: 1.0
  gif_max_fps: 10.0

report:
  port: 5006
  offline: true
  address: 127.0.0.1

export:
  format: html

# Diagnostic logging (per-run file under logs/<session_id>.log).
# Console stays quiet (anomalies only); the file gets the full DEBUG trace.
logging:
  console: true
  console_level: INFO      # DEBUG | INFO | WARNING | ERROR
  file_level: DEBUG        # set INFO to shrink log files
  dir: logs
