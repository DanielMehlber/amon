# Deprecated: use test.yaml (file / synthetic) or stream.yaml (live capture).
# Kept as an alias of test.yaml so older docs and scripts keep working.

session_name: test
data_dir: data

video_source:
  class: amon.sources.file.VideoFileSource
  config:
    path: test-video.avi
    realtime: false

calibration:
  duration_seconds: 10.0

detectors:
  - class: amon.detectors.temporal.TemporalDetector
    config: {}
  - class: amon.detectors.hud.HudDetector
    config: {}
  - class: amon.detectors.spatial.SpatialDetector
    config: {}

aggregation:
  cooldown_seconds: 1.0
  min_duration_seconds: 0.5
  suppresses:
    temporal/flicker: ["*"]
    temporal/noise: ["temporal/contrast", "hud/*", "spatial/*"]
    temporal/contrast: ["hud/*", "spatial/*"]
    hud/*/size: ["hud/*/text", "hud/*/position"]
    hud/*/position: ["hud/*/text"]

media:
  max_clip_seconds: 6.0
  lead_seconds: 1.0
  gif_max_fps: 10.0

report:
  port: 5006
  offline: true
  address: 127.0.0.1

export:
  format: html
