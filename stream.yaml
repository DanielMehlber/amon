# AMON live video-input configuration (USB capture adapter, capture card, …).
#
# Adjust ``device`` to the OS index or path (e.g. 0 or /dev/video0).
# Native resolution and FPS are auto-detected.  Image transforms live under
# ``preprocessing`` (scale / rotate / brightness / contrast).
#
#   python -m amon monitor stream.yaml
#   python -m amon report stream.yaml

session_name: stream
data_dir: data

video_source:
  class: amon.sources.stream.VideoInputStream
  config:
    device: 0                # portable index (0, 1, …); or /dev/video0 on Linux
    # capture_fourcc: MJPG   # optional; depends on the capture device
    processing_fps: 10       # optional cap; native rate auto-detected

preprocessing:
  scale: 50                  # percent of input size (aspect ratio preserved)
  rotate: 0                  # degrees clockwise (90 / 180 / 270 use fast path)
  brightness: 0              # additive offset [-255, 255]
  contrast: 1.0              # multiplicative gain (1.0 = unchanged)

calibration:
  duration_seconds: 10.0

detectors:
  - class: amon.detectors.temporal.TemporalDetector
    config: {}
  - class: amon.detectors.hud.HudDetector
    config:
      glyph_font: VCR_OSD_MONO_1.001.ttf   # file under amon/fonts/ (or absolute path)
      # max_glyph_height: 64              # reject oversized bright blobs as letters
      # max_glyph_width: 64
  - class: amon.detectors.spatial.SpatialDetector
    config: {}

aggregation:
  cooldown_seconds: 1.0
  min_duration_seconds: 0.5
  # Exclusion hierarchy: primary anomalies suppress their side-effects.
  suppresses:
    temporal/flicker: ["*"]
    temporal/noise: ["temporal/contrast", "hud/*", "spatial/*"]
    temporal/contrast: ["hud/*", "spatial/*"]
    hud/*/size: ["hud/*/text", "hud/*/position"]
    hud/*/position: ["hud/*/text"]

media:
  max_clip_seconds: 6.0
  lead_seconds: 1.0
  gif_max_fps: 10.0

report:
  port: 5006
  offline: true
  address: 127.0.0.1       # use 0.0.0.0 to reach the UI from other hosts

export:
  format: html

logging:
  console: true
  console_level: INFO
  file_level: DEBUG
  dir: logs
